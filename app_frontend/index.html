<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon-192.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#5f0113" />
    <meta name="description" content="HU Gibi Gubae — worship, fellowship, learning, and service for Haramaya University students." />
    <meta name="application-name" content="HU Gibi Gubae" />
    <meta name="apple-mobile-web-app-title" content="HU Gubae" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light;
        background: #fff8f7;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 5% 10%, rgba(243, 201, 19, 0.22), transparent 45%),
          radial-gradient(circle at 90% 5%, rgba(95, 1, 19, 0.28), transparent 42%),
          #fff8f7;
        color: #241919;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        background: #140d0f;
      }

      html[data-theme="dark"] body {
        background:
          radial-gradient(circle at 5% 10%, rgba(236, 195, 2, 0.16), transparent 45%),
          radial-gradient(circle at 90% 5%, rgba(180, 81, 99, 0.22), transparent 42%),
          #140d0f;
        color: #f8ecee;
      }
    </style>
    <script>
      (() => {
        try {
          const storageKey = "church-student-pwa-theme";
          const savedTheme = localStorage.getItem(storageKey);
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : prefersDark
                ? "dark"
                : "light";

          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>HU Gibi Gubae | Member App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
